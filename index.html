const { useState, useEffect } = React;

/* ============================================================
   Atoms

function Placeholder({ caption, aspect = "4/5", dark = false, className = "", style = {} }) {

function Eyebrow({ children, n }) {

      <span style={{ width: 18, height: 1, background: "currentColor", opacity: 0.35 }} />
      {children}
    </div>
  );
}

function useReveal() {
  useEffect(() => {
    const raf = requestAnimationFrame(() => {
      const els = document.querySelectorAll(".reveal");
      const vh = window.innerHeight;
      els.forEach((el) => {
        const r = el.getBoundingClientRect();
        if (r.top < vh * 0.92) el.classList.add("in");
      });
      const io = new IntersectionObserver(
        (entries) => entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
        }),
        { threshold: 0.08, rootMargin: "0px 0px -5% 0px" }
      );
      els.forEach((el) => { if (!el.classList.contains("in")) io.observe(el); });
      window.__revealIO = io;
    });
    return () => {
      cancelAnimationFrame(raf);
      if (window.__revealIO) window.__revealIO.disconnect();
    };
  }, []);
}
